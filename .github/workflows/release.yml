name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the three pinned RA source hashes
        id: ra-source-hashes
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const sources=JSON.parse(readFileSync('data/national/sources.json','utf8'));
          const hashes=['raPart1','raPart2','raGrants'].map(key=>sources[key].sha256);
          if(hashes.some(hash=>!/^[a-f0-9]{64}$/.test(hash)))throw new Error('Invalid pinned RA source hash');
          console.log('hashes='+hashes.join('-'));
          NODE
      - name: Restore the pinned RA workbooks
        uses: actions/cache@v6.1.0
        with:
          path: |
            data/raw/RA_2026-27_data_Part_1.ods
            data/raw/RA_2026-27_data_Part_2.ods
            data/raw/SG_2026-27.ods
          key: ${{ runner.os }}-ra-${{ steps.ra-source-hashes.outputs.hashes }}
      - name: Prepare and verify the pinned RA workbooks
        run: |
          node scripts/import-ra-budget.mjs
          git diff --exit-code -- data/national/budget.json
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BUILD_OG: '1'
      - run: npm run test:dist
      - run: npm run test:text
      - run: node scripts/audit-links.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: npm run test:csp -- --workers=2
      - name: Publish verified production build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler pages deploy dist --project-name ukcounciltax --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Tells IndexNow (Bing and partners) about the live sitemap. Runs only after
      # a successful production publish and can never fail the release.
      - name: Notify IndexNow
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sleep 20
          node scripts/indexnow.mjs || echo "::warning::IndexNow submission failed; the deploy is unaffected"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  number-diff:
    name: number diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: baseline
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.nvmrc
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json

      - name: Build main
        working-directory: baseline
        run: |
          npm ci
          env -u BUILD_OG npm run build

      - name: Build the PR head
        working-directory: candidate
        run: |
          npm ci
          env -u BUILD_OG npm run build

      - name: Compare page numbers
        id: numbers
        continue-on-error: true
        working-directory: candidate
        run: node .github/scripts/number-review.mjs ../baseline/dist dist ../number-diff.txt

      - name: Keep the full number report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: number-diff
          path: number-diff.txt*
          if-no-files-found: warn
          retention-days: 14

      - name: Update the number review comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- ukcounciltax-number-diff -->';
            const report = fs.existsSync('number-diff.txt.md')
              ? fs.readFileSync('number-diff.txt.md', 'utf8')
              : '## Number diff\n\nThe comparison could not complete. Read the job log.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n[Full output and job log](${run})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

      - name: Require an allowed number comparison
        if: always() && steps.numbers.outcome != 'success'
        run: |
          echo 'The number comparison found unallowed differences or could not complete.'
          exit 1

