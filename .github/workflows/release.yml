name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare and verify the pinned RA workbooks
        run: |
          node scripts/import-ra-budget.mjs
          git diff --exit-code -- data/national/budget.json
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BUILD_OG: '1'
      - run: npm run test:dist
      - run: npm run test:text
      - run: node scripts/audit-links.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: npm run test:csp -- --workers=2
      - name: Publish verified production build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler pages deploy dist --project-name ukcounciltax --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Tells IndexNow (Bing and partners) about the live sitemap. Runs only after
      # a successful production publish and can never fail the release.
      - name: Notify IndexNow
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sleep 20
          node scripts/indexnow.mjs || echo "::warning::IndexNow submission failed; the deploy is unaffected"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
