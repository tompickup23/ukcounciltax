<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 456" role="img" class="ek-chart" aria-label="Gap between the example guess and the published share for each service, in pence"><text x="4" y="26" font-size="20" font-family="'Source Sans 3', sans-serif" style="fill:var(--text)">Adult Social Care</text><rect x="299.89" y="36" width="1.50" height="22" rx="3" style="fill:var(--accent)"/><text x="291.89" y="53" font-size="20" font-weight="600" font-family="'Source Sans 3', sans-serif" text-anchor="end" font-variant-numeric="tabular-nums" style="fill:var(--text)">0.0p</text><text x="4" y="96.4" font-size="20" font-family="'Source Sans 3', sans-serif" style="fill:var(--text)">Housing Services (GFRA only)</text><rect x="300.00" y="106.4" width="170.00" height="22" rx="3" style="fill:var(--accent)"/><text x="478.00" y="123.4" font-size="20" font-weight="600" font-family="'Source Sans 3', sans-serif" text-anchor="start" font-variant-numeric="tabular-nums" style="fill:var(--text)">17.6p over</text><text x="4" y="166.8" font-size="20" font-family="'Source Sans 3', sans-serif" style="fill:var(--text)">Cultural and Related Services</text><rect x="161.32" y="176.8" width="138.68" height="22" rx="3" style="fill:var(--accent)"/><text x="153.32" y="193.8" font-size="20" font-weight="600" font-family="'Source Sans 3', sans-serif" text-anchor="end" font-variant-numeric="tabular-nums" style="fill:var(--text)">14.3p under</text><text x="4" y="237.20000000000002" font-size="20" font-family="'Source Sans 3', sans-serif" style="fill:var(--text)">Environmental and Regulatory Services</text><rect x="236.84" y="247.20000000000002" width="63.16" height="22" rx="3" style="fill:var(--accent)"/><text x="228.84" y="264.20000000000005" font-size="20" font-weight="600" font-family="'Source Sans 3', sans-serif" text-anchor="end" font-variant-numeric="tabular-nums" style="fill:var(--text)">6.5p under</text><text x="4" y="307.6" font-size="20" font-family="'Source Sans 3', sans-serif" style="fill:var(--text)">Central Services</text><rect x="300.00" y="317.6" width="31.95" height="22" rx="3" style="fill:var(--accent)"/><text x="339.95" y="334.6" font-size="20" font-weight="600" font-family="'Source Sans 3', sans-serif" text-anchor="start" font-variant-numeric="tabular-nums" style="fill:var(--text)">3.3p over</text><line x1="300" y1="30" x2="300" y2="360" stroke-width="1.5" style="stroke:var(--border-strong)"/><text x="292" y="386" font-size="19" font-family="'Source Sans 3', sans-serif" text-anchor="end" style="fill:var(--text-muted)">Guessed too little</text><text x="308" y="386" font-size="19" font-family="'Source Sans 3', sans-serif" style="fill:var(--text-muted)">Guessed too much</text><text x="4" y="418" font-size="19" font-family="'Source Sans 3', sans-serif" style="fill:var(--text-muted)">Gap: your pence less the published share. The published share is</text><text x="4" y="443" font-size="19" font-family="'Source Sans 3', sans-serif" style="fill:var(--text-muted)">each service's amount over the five services' total, times 100.</text></svg>
